{
  "version": 2,
  "updates": [
    {
      "package-ecosystem": "github-actions",
      "schedule": {
        "interval": "weekly",
        "day": "monday",
        "time": "09:00",
        "timezone": "Asia/Shanghai"
      },
      "open-pull-requests-limit": 3,
      "cooldown": {
        "default-days": 7
      },
      "groups": {
        "minor-and-patch": {
          "patterns": [
            "*"
          ],
          "update-types": [
            "minor",
            "patch"
          ]
        }
      },
      "commit-message": {
        "prefix": "chore",
        "include": "scope"
      },
      "directory": "/"
    },
    {
      "package-ecosystem": "npm",
      "schedule": {
        "interval": "weekly",
        "day": "monday",
        "time": "09:00",
        "timezone": "Asia/Shanghai"
      },
      "open-pull-requests-limit": 3,
      "cooldown": {
        "default-days": 7
      },
      "groups": {
        "minor-and-patch": {
          "patterns": [
            "*"
          ],
          "update-types": [
            "minor",
            "patch"
          ]
        }
      },
      "commit-message": {
        "prefix": "chore",
        "include": "scope"
      },
      "directory": "/"
    }
  ]
}
