name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      publish_chrome:
        description: "Publish the build to Chrome Web Store."
        required: true
        default: false
        type: boolean
      publish_edge:
        description: "Publish the build to Microsoft Edge Add-ons."
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build extension
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      zip_name: ${{ steps.package.outputs.zip_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build release package
        run: pnpm release:build

      - name: Locate release zip
        id: package
        run: |
          zip_path="$(find release -maxdepth 1 -name '*.zip' | sort | head -n 1)"
          if [ -z "$zip_path" ]; then
            echo "No release zip found." >&2
            exit 1
          fi
          echo "zip_path=$zip_path" >> "$GITHUB_OUTPUT"
          echo "zip_name=$(basename "$zip_path")" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.package.outputs.zip_name }}
          path: ${{ steps.package.outputs.zip_path }}
          if-no-files-found: error

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${{ steps.package.outputs.zip_path }}" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$tag" "${{ steps.package.outputs.zip_path }}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$tag" \
              --notes "Chromium extension build for $tag."
          fi

  publish-chrome:
    name: Publish to Chrome Web Store
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish_chrome) }}
    runs-on: ubuntu-latest
    environment:
      name: chrome-web-store

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        run: corepack enable

      - name: Download release package
        uses: actions/download-artifact@v6
        with:
          name: ${{ needs.build.outputs.zip_name }}
          path: release

      - name: Publish to Chrome Web Store
        env:
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: pnpm cws:publish "release/${{ needs.build.outputs.zip_name }}"

  publish-edge:
    name: Publish to Microsoft Edge Add-ons
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish_edge) }}
    runs-on: ubuntu-latest
    environment:
      name: edge-addons

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        run: corepack enable

      - name: Download release package
        uses: actions/download-artifact@v6
        with:
          name: ${{ needs.build.outputs.zip_name }}
          path: release

      - name: Publish to Microsoft Edge Add-ons
        env:
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_CERTIFICATION_NOTES: ${{ secrets.EDGE_CERTIFICATION_NOTES }}
        run: pnpm edge:publish "release/${{ needs.build.outputs.zip_name }}"
